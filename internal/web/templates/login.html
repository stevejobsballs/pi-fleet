{{define "content"}}
<form method="post" action="/login" class="narrow">
  {{with .Data.Next}}<input type="hidden" name="next" value="{{.}}">{{end}}
  {{with .Data.Error}}<p class="error" role="alert">{{.}}</p>{{end}}
  <label>Username <input name="username" value="{{.Data.Username}}" autocomplete="username" required{{if not .Data.Username}} autofocus{{end}}></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required{{if .Data.Username}} autofocus{{end}}></label>
  <button>Sign in</button>
</form>
{{end}}
