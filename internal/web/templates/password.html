{{define "content"}}
{{if .Data.Forced}}<p class="warn">You must choose a new password before continuing.</p>{{else}}<p>Your password expires {{when .Data.Expires}}.</p>{{end}}
<form method="post" action="/password" class="narrow">
  {{template "csrf" .CSRF}}
  {{with .Data.Error}}<p class="error" role="alert">{{.}}</p>{{end}}
  <label>Current or one-time password <input name="current" type="password" autocomplete="current-password" required></label>
  <label>New password (at least 12 characters, not one of your last 5) <input name="new" type="password" autocomplete="new-password" minlength="12" required></label>
  <label>Confirm new password <input name="confirm" type="password" autocomplete="new-password" minlength="12" required></label>
  <button>Change password</button>
</form>
{{end}}
