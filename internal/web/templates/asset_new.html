{{define "content"}}
<form method="post" action="/assets" class="narrow">
  {{template "csrf" .CSRF}}
  <label>Asset tag (as on the label) <input name="tag" required></label>
  <label>Location <select name="location" required>{{range .Data}}<option value="{{.ID}}">{{.Label}}</option>{{end}}</select></label>
  <label>Manufacturer <input name="manufacturer" required></label>
  <label>Model <input name="model" required></label>
  <label>Serial number <input name="serial"></label>
  <label>Risk class <select name="risk_class"><option value="">not set</option><option>low</option><option>medium</option><option>high</option></select></label>
  <label class="check"><input type="checkbox" name="reference" value="yes"> This is a reference standard used to calibrate other equipment</label>
  <button>Register</button>
</form>
{{end}}
